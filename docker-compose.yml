services:
  mongodb:
    image: mongo:7
    container_name: atelier-mongodb
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-atelier}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-atelier_secret_change_me}
    volumes:
      - /opt/atelier-liuteria/data/mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5

  minio:
    image: pgsty/minio:latest
    container_name: atelier-minio
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-atelier_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-atelier_minio_secret_change_me}
    volumes:
      - /opt/atelier-liuteria/data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
